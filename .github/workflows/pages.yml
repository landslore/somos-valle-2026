name: Update ECM Data Snapshot for GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Actualiza el snapshot estático (docs/data.json) cada 6 horas automáticamente
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Actualizar snapshot de ECM (docs/data.json y docs/index.html)
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/update-data.mjs

      - name: Commit y Push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/index.html docs/404.html
          git diff --staged --quiet || (git commit -m "chore: update ECM live data snapshot" && git push)
